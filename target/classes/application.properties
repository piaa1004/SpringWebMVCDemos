server.port=8080

# Thymeleaf: classpath:/templates/<view>.html
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart (default enabled, but set explicit limits for upload demos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=info
logging.level.com.ysy.webmvc=debug
logging.level.org.springframework.web=info
# CommonsRequestLoggingFilter 는 DEBUG 레벨에서만 출력 (dispatcherservlet/logging 토픽)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=debug

# i18n message source (used by dispatcherservlet/locale)
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
